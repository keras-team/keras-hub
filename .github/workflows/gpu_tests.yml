name: KerasHub GPU Tests

on:
  push:
    branches: [master]
  pull_request:
    types: [labeled, synchronize]
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  # One group per PR for the run-gpu-tests label and for pushes, so a push
  # cancels a stale in-progress run. Any other label gets its own group and
  # can never cancel a live run. On push/release head_ref is empty, so the
  # key falls back to run_id and master runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.event.action == 'labeled' && github.event.label.name || 'run-gpu-tests' }}
  cancel-in-progress: true

jobs:
  cancel_stale:
    # A push to a PR claims this PR's concurrency group, which cancels a GPU
    # run still going for the previous commit. It deliberately does not
    # re-run the tests: add the run-gpu-tests label again to test the new
    # commit. A real job is needed here; a run whose jobs are all skipped is
    # not guaranteed to cancel anything.
    name: Cancel stale GPU run
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
    - env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: echo "Superseded by ${HEAD_SHA}"

  gpu_tests:
    # Only run on pushes to master, releases or when "run-gpu-tests" is added
    if: |
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-gpu-tests')

    strategy:
      fail-fast: false
      matrix:
        backend: [jax, tensorflow, torch]
        shard: [1, 2, 3, 4]

    name: GPU tests (${{ matrix.backend }}, shard ${{ matrix.shard }})
    runs-on: linux-x86-g2-32-l4-1gpu
    timeout-minutes: 300

    container:
      image: python:3.11-slim

    env:
      KERAS_BACKEND: ${{ matrix.backend }}

    steps:
    - name: Install binary dependencies
      run: |
        apt-get update
        apt-get -y install build-essential curl git gnupg
        git config --global --add safe.directory '*'

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check CUDA Version
      run: nvidia-smi

    - name: Install dependencies
      run: |
        pip install -r requirements-${{ matrix.backend }}-cuda.txt --progress-bar off --timeout 1000
        pip install huggingface_hub --progress-bar off
        pip install --no-deps -e "." --progress-bar off

    - name: Test with pytest
      env:
        # Prevent TF from pre-allocating all GPU memory, leaving room for
        # the primary backend (torch/jax) when TF is used for preprocessing.
        TF_FORCE_GPU_ALLOW_GROWTH: "true"
        # Only the test step downloads presets; keep the secrets out of the
        # install and setup steps above.
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      run: |
        mkdir -p .github/test_durations
        pytest keras_hub --check_gpu --run_large --cov=keras_hub \
          --durations=50 --splits 4 --group ${{ matrix.shard }} \
          --durations-path .github/test_durations/${{ matrix.backend }}.json \
          --store-durations --clean-durations

    # pytest-split cuts the collection into four contiguous slices of equal
    # summed time using the per-test durations committed in
    # .github/test_durations/<backend>.json, so test files are split only at
    # the three shard boundaries; tests missing from the file get the average.
    # The interleaving `least_duration` algorithm balances too, but splitting
    # a file across shards makes every shard recompile every model (+105 min
    # on jax, measured). --clean-durations rewrites the durations file with only
    # this shard's fresh timings; to refresh the committed files download the
    # `durations-*` artifacts of a run and union the four shard files per
    # backend.
    - name: Upload test durations
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: durations-${{ matrix.backend }}-${{ matrix.shard }}
        path: .github/test_durations/${{ matrix.backend }}.json
        if-no-files-found: ignore
        retention-days: 90
