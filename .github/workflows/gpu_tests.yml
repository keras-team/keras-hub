name: KerasHub GPU Tests

on:
  push:
    branches: [master]
  pull_request:
    types: [unlabeled]
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gpu_tests:
    # Only run on pushes to master, releases or "kokoro:force-run" unlabel
    if: |
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'kokoro:force-run')

    strategy:
      fail-fast: false
      matrix:
        backend: [jax, tensorflow, torch]

    name: GPU tests (${{ matrix.backend }})
    runs-on: keras-linux-x86-g2-32-l4-1gpu
    timeout-minutes: 240

    container:
      image: python:3.11-slim

    env:
      KERAS_BACKEND: ${{ matrix.backend }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}

    steps:
    - name: Install binary dependencies
      run: |
        apt-get update
        apt-get -y install build-essential curl git gnupg procps
        git config --global --add safe.directory '*'

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check system resources
      run: |
        echo "=== GPU Info ==="
        nvidia-smi
        echo ""
        echo "=== System Memory ==="
        free -h
        echo ""
        echo "=== CPU Info ==="
        grep -c processor /proc/cpuinfo && grep "model name" /proc/cpuinfo | head -1
        echo ""
        echo "=== Disk Space ==="
        df -h
        echo ""
        echo "=== Container cgroup memory limits ==="
        echo -n "cgroup v2 (memory.max): "; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo "N/A"
        echo -n "cgroup v1 (memory.limit_in_bytes): "; cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "N/A"
        echo ""
        echo "=== Container cgroup memory usage ==="
        echo -n "cgroup v2 (memory.current): "; cat /sys/fs/cgroup/memory.current 2>/dev/null || echo "N/A"
        echo -n "cgroup v1 (memory.usage_in_bytes): "; cat /sys/fs/cgroup/memory/memory.usage_in_bytes 2>/dev/null || echo "N/A"

    - name: Install dependencies
      run: |
        pip install -U pip setuptools psutil
        pip install -r requirements-${{ matrix.backend }}-cuda.txt --progress-bar off --timeout 1000
        # CUDA toolkit (ptxas) needed for TF XLA JIT via tensorflow-text.
        pip install nvidia-cuda-nvcc-cu12 --progress-bar off
        pip install huggingface_hub --progress-bar off
        pip install --no-deps -e "." --progress-bar off

    - name: Test with pytest
      env:
        # Prevent TF from pre-allocating all GPU memory, leaving room for
        # the primary backend (torch/jax) when TF is used for preprocessing.
        TF_FORCE_GPU_ALLOW_GROWTH: "true"
      run: |
        # Start background GPU/RAM monitor (logs every 30s)
        (while true; do
          TS=$(date -u +%H:%M:%S)
          GPU=$(nvidia-smi --query-gpu=memory.used,memory.total,utilization.gpu --format=csv,noheader,nounits 2>/dev/null || echo "N/A")
          RAM=$(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{u=t-a; printf "%dMB/%dMB (%.0f%%)", u/1024, t/1024, u/t*100}' /proc/meminfo 2>/dev/null || echo "N/A")
          echo "$TS | GPU: $GPU | RAM: $RAM"
          sleep 30
        done) > /tmp/resource_monitor.log 2>&1 &
        echo $! > /tmp/monitor_pid

        pytest keras_hub --check_gpu --run_large --cov=keras_hub --durations=50

    - name: Post-test diagnostics
      if: always()
      run: |
        # Stop monitor
        kill "$(cat /tmp/monitor_pid 2>/dev/null)" 2>/dev/null || true

        echo "=== Resource Usage Over Time ==="
        cat /tmp/resource_monitor.log 2>/dev/null || echo "No monitor log found"

        echo ""
        echo "=== Final GPU State ==="
        nvidia-smi 2>/dev/null || echo "nvidia-smi failed (GPU may be inaccessible)"

        echo ""
        echo "=== Final System Memory ==="
        free -h 2>/dev/null || echo "free command unavailable"

        echo ""
        echo "=== Container cgroup memory state ==="
        echo -n "Current usage: "; cat /sys/fs/cgroup/memory.current 2>/dev/null || cat /sys/fs/cgroup/memory/memory.usage_in_bytes 2>/dev/null || echo "N/A"
        echo -n "Peak usage: "; cat /sys/fs/cgroup/memory.peak 2>/dev/null || cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes 2>/dev/null || echo "N/A"
        echo -n "Limit: "; cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "N/A"
        echo -n "OOM events: "; cat /sys/fs/cgroup/memory.events 2>/dev/null | grep oom || echo "N/A"
