name: PR approved issue check
# Every PR from an external contributor is converted to a draft when opened and
# stays a draft until its description links an approved issue that is assigned
# to the PR author. Once it does, the PR is marked "Ready for review"
# automatically. Repository owners, org members, collaborators and bots bypass
# this check.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: write # Needed, with pull-requests: write, to toggle draft state.
  issues: read
  pull-requests: write

jobs:
  approved-issue:
    uses: keras-team/shared-workflows/.github/workflows/pr-approved-issue.yml@6db8e7ce7ef4014a0452ad5ada0927fcaa039081
    with:
      ref: '6db8e7ce7ef4014a0452ad5ada0927fcaa039081'
