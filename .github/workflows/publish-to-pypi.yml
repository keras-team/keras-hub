name: Publish to PyPI

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Get pip cache dir
        id: pip-cache
        run: |
          python -m pip install --upgrade pip setuptools
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-common.txt') }}-${{ hashFiles('requirements.txt') }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt --progress-bar off
      - name: Build a binary wheel and a source tarball
        run: >-
          python pip_build.py
      - name: Extract package versions
        if: startsWith(github.ref, 'refs/tags')
        id: pkg_version
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import email, glob, tarfile, zipfile
          def get_ver(folder):
            files = sorted(glob.glob(f"{folder}/*.whl") + glob.glob(f"{folder}/*.tar.gz"))
            assert files, f"No distributions found in {folder}/"
            f = files[0]
            if f.endswith(".whl"):
              with zipfile.ZipFile(f) as zf:
                meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
                raw = zf.read(meta).decode("utf-8")
            else:
              with tarfile.open(f) as tf:
                info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
                raw = tf.extractfile(info).read().decode("utf-8")
            return email.message_from_string(raw)["Version"].strip()
          print(f"hub_ver={get_ver('dist')}")
          print(f"nlp_ver={get_ver('keras_nlp/dist')}")
          PY
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        if: startsWith(github.ref, 'refs/tags')
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        if: startsWith(github.ref, 'refs/tags')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Clean up previous staging attempts for these versions (if any)
        if: startsWith(github.ref, 'refs/tags')
        env:
          HUB_VER: ${{ steps.pkg_version.outputs.hub_ver }}
          NLP_VER: ${{ steps.pkg_version.outputs.nlp_ver }}
        run: |
          set -euo pipefail
          cleanup_pkg() {
            local pkg="$1" ver="$2"
            set +e
            gcloud artifacts versions describe "${ver}" \
              --package="${pkg}" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="keras-hub--pypi" >/dev/null 2>describe.err
            local rc=$?
            set -e
            if [ "${rc}" -eq 0 ]; then
              gcloud artifacts versions delete "${ver}" \
                --package="${pkg}" \
                --project="oss-exit-gate-prod" \
                --location="us" \
                --repository="keras-hub--pypi" \
                --quiet
            elif ! grep -Eqi "NOT_FOUND|not.found|404" describe.err; then
              cat describe.err >&2
              exit "${rc}"
            fi
            rm -f describe.err
          }
          cleanup_pkg "keras-hub" "${HUB_VER}"
          cleanup_pkg "keras-nlp" "${NLP_VER}"
      - name: Stage KerasHub to OSS Exit Gate
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://us-python.pkg.dev/oss-exit-gate-prod/keras-hub--pypi/
          user: oauth2accesstoken
          password: ${{ steps.auth.outputs.auth_token }}
          attestations: false
          verbose: true
      - name: Stage KerasNLP to OSS Exit Gate
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: keras_nlp/dist/
          repository-url: https://us-python.pkg.dev/oss-exit-gate-prod/keras-hub--pypi/
          user: oauth2accesstoken
          password: ${{ steps.auth.outputs.auth_token }}
          attestations: false
          verbose: true
      - name: Upload OSS Exit Gate manifest
        if: startsWith(github.ref, 'refs/tags')
        env:
          HUB_VER: ${{ steps.pkg_version.outputs.hub_ver }}
          NLP_VER: ${{ steps.pkg_version.outputs.nlp_ver }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          jq -n --arg hver "${HUB_VER}" --arg nver "${NLP_VER}" '{
            publish_all: false,
            publishing_groups: [{
              packages: [
                {name: "keras-hub", version: $hver},
                {name: "keras-nlp", version: $nver}
              ]
            }]
          }' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/keras-hub/pypi/manifests/manifest-${HUB_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"
